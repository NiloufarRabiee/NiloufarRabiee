  <circle r="4" fill="#F8FAFC" filter="url(#glow)"><animateMotion dur="4.4s" repeatCount="indefinite" path="M380 99L538 135L600 150L662 135L820 99"/></circle>
  <circle r="4" fill="#F8FAFC" filter="url(#glow)"><animateMotion dur="4.4s" begin="2.2s" repeatCount="indefinite" path="M380 201L538 165L600 150L662 165L820 201"/></circle>

  <rect x="1" y="1" width="1198" height="298" rx="23" stroke="#E2E8F0" stroke-opacity="0.06"/>
