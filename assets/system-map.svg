  <g transform="translate(600 150)">
    <circle r="66" fill="#7DD3FC" fill-opacity="0.025" stroke="#7DD3FC" stroke-opacity="0.08"/>
    <circle r="54" fill="#091421" stroke="url(#signal)" stroke-opacity="0.72" stroke-width="1.6"/>
    <text x="0" y="-4" text-anchor="middle" fill="#F8FAFC" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="800" letter-spacing="1.2">N</text>
