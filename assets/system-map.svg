      <text x="154" y="127" fill="#A7F0E5" font-size="13" font-weight="800" letter-spacing="1.2">01 / BUILT ENVIRONMENT</text>
      <text x="154" y="153" fill="#A2B2C7" font-size="13">architecture · urban interfaces</text>
      <circle cx="372" cy="114" r="4.5" fill="#5EEAD4"/>
    </g>
    <g>
      <rect x="128" y="236" width="270" height="92" rx="18" fill="#0B1422" stroke="#7DD3FC" stroke-opacity="0.32"/>
      <text x="154" y="271" fill="#BFE9FC" font-size="13" font-weight="800" letter-spacing="1.2">02 / HUMAN FACTORS</text>
      <text x="154" y="297" fill="#A2B2C7" font-size="13">emotion · behavior · accessibility</text>
      <circle cx="372" cy="258" r="4.5" fill="#7DD3FC"/>
    </g>
    <g>
      <rect x="802" y="92" width="270" height="92" rx="18" fill="#0B1422" stroke="#C4B5FD" stroke-opacity="0.32"/>
      <text x="828" y="127" fill="#DFD8FE" font-size="13" font-weight="800" letter-spacing="1.2">03 / INTELLIGENCE</text>
      <text x="828" y="153" fill="#A2B2C7" font-size="13">AI · perception · adaptive systems</text>
      <circle cx="828" cy="114" r="4.5" fill="#C4B5FD"/>
    </g>
    <g>
      <rect x="802" y="236" width="270" height="92" rx="18" fill="#0B1422" stroke="#91C9FC" stroke-opacity="0.32"/>
      <text x="828" y="271" fill="#C9E9FF" font-size="13" font-weight="800" letter-spacing="1.2">04 / APPLE ECOSYSTEM</text>
      <text x="828" y="297" fill="#A2B2C7" font-size="13">SwiftUI · spatial · health · interaction</text>
      <circle cx="828" cy="258" r="4.5" fill="#91C9FC"/>
    </g>
  </g>

  <g transform="translate(600 192)">
    <circle r="92" fill="#7DD3FC" fill-opacity="0.035" stroke="#7DD3FC" stroke-opacity="0.08"/>
    <circle r="72" fill="#091321" stroke="url(#signal)" stroke-opacity="0.65" stroke-width="1.5"/>
    <circle r="53" fill="#07101C" stroke="#E2E8F0" stroke-opacity="0.08"/>
    <text x="0" y="-6" text-anchor="middle" fill="#F8FAFC" font-family="Georgia, Times New Roman, serif" font-size="39" font-weight="700">N</text>
    <text x="0" y="21" text-anchor="middle" fill="#9EB0C6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1.8">INTERACTION</text>
    <circle cx="0" cy="-72" r="5" fill="#5EEAD4" filter="url(#glow)">
      <animate attributeName="r" values="3.5;6.5;3.5" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle r="4.5" fill="#F8FAFC" filter="url(#glow)">
    <animateMotion dur="4.6s" repeatCount="indefinite" path="M386 130L522 170L600 192L678 170L814 130"/>
  </circle>
  <circle r="4.5" fill="#F8FAFC" filter="url(#glow)">
