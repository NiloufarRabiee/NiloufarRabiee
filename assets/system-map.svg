    <g>
      <rect x="820" y="164" width="300" height="74" rx="17" fill="#0B1421" stroke="#7DD3FC" stroke-opacity="0.28"/>
      <text x="848" y="194" fill="#BCE8FB" font-size="13" font-weight="800" letter-spacing="1">04 · APPLE ECOSYSTEM</text>
      <text x="848" y="218" fill="#9DADC1" font-size="13">SwiftUI · spatial · health · interaction</text>
      <circle cx="846" cy="201" r="4" fill="#7DD3FC"/>
