<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#070B13"/><stop offset="1" stop-color="#09111D"/></linearGradient>
    <linearGradient id="signal" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#5EEAD4"/><stop offset="0.52" stop-color="#7DD3FC"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0L0 0 0 48" fill="none" stroke="#9FB3CD" stroke-opacity="0.035"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>

  <text x="58" y="34" fill="#71829A" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="1.8">SYSTEM COORDINATES / ONE INTERACTION LAYER</text>
  <text x="1142" y="34" text-anchor="end" fill="#53667F" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">NR / 2026</text>

  <g stroke="url(#signal)" stroke-opacity="0.36" stroke-width="1.4">
    <path d="M380 99L538 135"/>
    <path d="M380 201L538 165"/>
    <path d="M820 99L662 135"/>
    <path d="M820 201L662 165"/>
  </g>

  <g font-family="Inter,system-ui,sans-serif">
