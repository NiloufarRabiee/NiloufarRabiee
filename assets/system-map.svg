      <rect x="80" y="164" width="300" height="74" rx="17" fill="#0B1421" stroke="#7DD3FC" stroke-opacity="0.28"/>
      <text x="108" y="194" fill="#BCE8FB" font-size="13" font-weight="800" letter-spacing="1">02 · HUMAN FACTORS</text>
      <text x="108" y="218" fill="#9DADC1" font-size="13">emotion · behavior · accessibility</text>
      <circle cx="354" cy="201" r="4" fill="#7DD3FC"/>
    </g>
    <g>
      <rect x="820" y="62" width="300" height="74" rx="17" fill="#0B1421" stroke="#C4B5FD" stroke-opacity="0.28"/>
      <text x="848" y="92" fill="#DDD6FE" font-size="13" font-weight="800" letter-spacing="1">03 · INTELLIGENCE</text>
      <text x="848" y="116" fill="#9DADC1" font-size="13">AI · perception · adaptive systems</text>
      <circle cx="846" cy="99" r="4" fill="#C4B5FD"/>
