<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070A12"/>
      <stop offset="1" stop-color="#0A1120"/>
    </linearGradient>
    <linearGradient id="signal" x1="154" y1="0" x2="1046" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0L0 0 0 38" fill="none" stroke="#9FB3CD" stroke-opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1200" height="380" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="26" fill="url(#grid)"/>

  <text x="70" y="58" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">SYSTEM COORDINATES</text>
  <text x="70" y="84" fill="#74859C" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="1.7">FOUR DOMAINS / ONE INTERACTION LAYER</text>

  <g stroke="url(#signal)" stroke-opacity="0.48" stroke-width="1.5" stroke-dasharray="5 8">
    <path d="M386 130L522 170"/>
    <path d="M386 286L522 214"/>
    <path d="M814 130L678 170"/>
    <path d="M814 286L678 214"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g>
