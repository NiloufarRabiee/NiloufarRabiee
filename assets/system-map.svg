  <text x="1130" y="352" text-anchor="end" fill="#65778F" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" letter-spacing="1.6">NR / COORDINATE MAP</text>
  <rect x="1" y="1" width="1198" height="378" rx="25" stroke="#E2E8F0" stroke-opacity="0.07"/>
