<svg width="1200" height="470" viewBox="0 0 1200 470" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070D"/>
      <stop offset="0.5" stop-color="#0A1220"/>
      <stop offset="1" stop-color="#070914"/>
    </linearGradient>
    <linearGradient id="signal" x1="110" y1="0" x2="1070" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(950 230) rotate(90) scale(220)">
      <stop stop-color="#7DD3FC" stop-opacity="0.16"/>
      <stop offset="0.62" stop-color="#5EEAD4" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#05070D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#9FB3CD" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="470" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="470" rx="30" fill="url(#grid)"/>
  <rect width="1200" height="470" rx="30" fill="url(#halo)"/>

  <!-- architectural registration marks -->
  <g stroke="#CBD5E1" stroke-opacity="0.15" stroke-width="1">
    <path d="M72 58H118M72 58V104"/>
    <path d="M1128 58H1082M1128 58V104"/>
    <path d="M72 412H118M72 412V366"/>
    <path d="M1128 412H1082M1128 412V366"/>
  </g>

  <!-- signal rail -->
  <path d="M92 86H520" stroke="url(#signal)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="92" cy="86" r="4" fill="#5EEAD4"/>
  <circle cx="520" cy="86" r="4" fill="#C4B5FD"/>
  <circle r="6" fill="#F8FAFC" filter="url(#glow)">
    <animateMotion dur="4.8s" repeatCount="indefinite" path="M92 86H520"/>
    <animate attributeName="opacity" values="0.15;1;0.15" dur="4.8s" repeatCount="indefinite"/>
  </circle>

  <!-- identity -->
  <text x="92" y="151" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="760" letter-spacing="-1.8">Niloufar Rabiee</text>
  <text x="94" y="197" fill="#AFC0D7" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600" letter-spacing="2.2">ARCHITECT  /  HUMAN–AI RESEARCH  /  APPLE DEVELOPMENT</text>

  <text x="94" y="270" fill="#E5EDF7" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="520">Designing systems where</text>
  <text x="94" y="307" fill="url(#signal)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="720">space · emotion · intelligence</text>
  <text x="94" y="344" fill="#E5EDF7" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="520">become interaction.</text>

  <g transform="translate(94 384)">
    <rect width="146" height="36" rx="18" fill="#5EEAD4" fill-opacity="0.075" stroke="#5EEAD4" stroke-opacity="0.35"/>
    <text x="73" y="23" text-anchor="middle" fill="#9DE8DD" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">HUMAN FIRST</text>
    <rect x="158" width="148" height="36" rx="18" fill="#7DD3FC" fill-opacity="0.075" stroke="#7DD3FC" stroke-opacity="0.35"/>
    <text x="232" y="23" text-anchor="middle" fill="#BDE8FB" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">BUILD TO TEST</text>
    <rect x="318" width="176" height="36" rx="18" fill="#C4B5FD" fill-opacity="0.075" stroke="#C4B5FD" stroke-opacity="0.35"/>
    <text x="406" y="23" text-anchor="middle" fill="#DED7FE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">CALM INTELLIGENCE</text>
  </g>

  <!-- signature orbit -->
  <g transform="translate(946 232)">
    <circle r="166" stroke="#C4B5FD" stroke-opacity="0.08" stroke-width="1"/>
    <circle r="132" stroke="#7DD3FC" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="8 11">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
    </circle>
    <circle r="98" stroke="#5EEAD4" stroke-opacity="0.22" stroke-width="1.4" stroke-dasharray="3 8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="69" fill="#0A1322" stroke="url(#signal)" stroke-opacity="0.75" stroke-width="1.5"/>
    <circle r="56" fill="#07101C" stroke="#E2E8F0" stroke-opacity="0.08"/>

    <text x="0" y="18" text-anchor="middle" fill="#F8FAFC" font-family="Georgia, Times New Roman, serif" font-size="72" font-weight="700">N</text>
    <text x="0" y="108" text-anchor="middle" fill="#8395AE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="2.2">SIGNAL / 01</text>

    <circle cx="0" cy="-132" r="6" fill="#5EEAD4" filter="url(#glow)">
      <animate attributeName="r" values="4;7;4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="98" cy="0" r="5" fill="#7DD3FC"/>
    <circle cx="-93" cy="31" r="5" fill="#C4B5FD"/>
  </g>

  <text x="1080" y="442" text-anchor="end" fill="#6F8098" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" letter-spacing="1.8">NR / SYSTEMS × 2026</text>
  <rect x="1" y="1" width="1198" height="468" rx="29" stroke="#E2E8F0" stroke-opacity="0.08"/>
</svg>