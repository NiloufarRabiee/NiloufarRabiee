    <path d="M927 438V335C927 295 953 269 985 269C1017 269 1043 295 1043 335V438"
          stroke="url(#accent)" stroke-width="2.2" fill="none" filter="url(#glow)"/>
    <path d="M941 437V338C941 307 960 287 985 287C1010 287 1029 307 1029 338V437"
          stroke="#F4F7FF" stroke-opacity=".22" stroke-width="1.1"/>
    <circle cx="985" cy="330" r="3.2" fill="#FFFFFF" filter="url(#glow)"/>
    <circle cx="967" cy="355" r="1.5" fill="#7DD3FC"/>
    <circle cx="1002" cy="374" r="1.3" fill="#C084FC"/>
    <circle cx="991" cy="397" r="1.1" fill="#FFFFFF"/>
    <path d="M958 385C972 371 992 369 1009 380"
