  <path d="M642 438C737 415 813 421 885 440C954 458 1039 460 1138 433V560H642Z"
        fill="#03070C" fill-opacity=".90"/>
  <path d="M692 468C820 438 978 440 1110 468"
        stroke="#7DD3FC" stroke-opacity=".20"/>
  <ellipse cx="986" cy="453" rx="108" ry="17" stroke="#7DD3FC" stroke-opacity=".22"/>
  <ellipse cx="986" cy="454" rx="76" ry="9" stroke="#C084FC" stroke-opacity=".18"/>

  <!-- celestial guide -->
  <path d="M985 66V250" stroke="#D7E1EE" stroke-opacity=".16"/>
  <path d="M977 92H993M985 84V100" stroke="#F8FAFC" stroke-width="1.2" filter="url(#glow)"/>
  <circle cx="985" cy="125" r="2.5" fill="#61F5D5"/>
  <path d="M974 155C977 165 984 170 993 170C987 175 982 177 976 174C970 170 968 163 974 155Z"
        fill="#7DD3FC" fill-opacity=".75"/>
  <circle cx="985" cy="211" r="2.3" fill="#C084FC"/>

  <text x="79" y="516" fill="#586A81"
        font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="10" font-weight="700" letter-spacing="1.8">
