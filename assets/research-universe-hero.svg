<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030812"/>
      <stop offset=".52" stop-color="#07101B"/>
      <stop offset="1" stop-color="#0D0718"/>
    </linearGradient>
    <linearGradient id="accent" x1="78" y1="0" x2="1118" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#61F5D5"/>
      <stop offset=".50" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="planet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1008 184) rotate(137) scale(185 180)">
      <stop stop-color="#1B3554"/>
      <stop offset=".48" stop-color="#0B1D31"/>
      <stop offset=".82" stop-color="#050B14"/>
      <stop offset="1" stop-color="#02050A"/>
    </radialGradient>
    <radialGradient id="portal" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(985 357) rotate(90) scale(117 84)">
      <stop stop-color="#6E5CFF" stop-opacity=".30"/>
      <stop offset=".42" stop-color="#37286E" stop-opacity=".19"/>
      <stop offset="1" stop-color="#090713" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" stroke="#9EB0C6" stroke-opacity=".025"/>
    </pattern>
  </defs>

  <rect width="1200" height="560" rx="32" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="32" fill="url(#grid)"/>

  <g opacity=".68">
    <circle cx="80" cy="58" r="1.1" fill="#FFFFFF"/>
    <circle cx="148" cy="107" r="1.3" fill="#7DD3FC"/>
    <circle cx="260" cy="70" r="1.0" fill="#C084FC"/>
    <circle cx="391" cy="103" r="1.2" fill="#F8FAFC"/>
    <circle cx="558" cy="61" r="1.2" fill="#61F5D5"/>
    <circle cx="692" cy="110" r="1.0" fill="#FFFFFF"/>
    <circle cx="814" cy="70" r="1.2" fill="#7DD3FC"/>
    <circle cx="1067" cy="61" r="1.3" fill="#C084FC"/>
    <circle cx="1126" cy="134" r="1.0" fill="#61F5D5"/>
    <circle cx="96" cy="473" r="1.2" fill="#7DD3FC"/>
    <circle cx="308" cy="492" r="1.1" fill="#FFFFFF"/>
    <circle cx="643" cy="473" r="1.0" fill="#C084FC"/>
  </g>

  <text x="78" y="99" fill="#72839A"
        font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="12" font-weight="700" letter-spacing="2.7">
    NILOUFAR RABIEE / RESEARCH UNIVERSE / 2026
  </text>

  <rect x="78" y="124" width="430" height="3" rx="1.5" fill="url(#accent)"/>

  <text x="78" y="205" fill="#F8FAFC"
        font-family="Inter,Arial,sans-serif"
        font-size="61" font-weight="800" letter-spacing="-2.2">
    I build systems
  </text>
  <text x="78" y="272" fill="#F8FAFC"
        font-family="Inter,Arial,sans-serif"
        font-size="61" font-weight="800" letter-spacing="-2.2">
