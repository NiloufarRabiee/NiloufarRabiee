  <path d="M876 96C915 55 990 31 1055 57C1106 78 1139 125 1140 178C1141 226 1113 271 1071 296C1090 261 1097 223 1087 188C1073 136 1026 96 972 88C939 83 906 87 876 96Z"
        fill="#06101B" fill-opacity=".82"/>
  <path d="M880 95C935 73 1006 80 1054 119"
