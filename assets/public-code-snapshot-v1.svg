<svg width="1200" height="410" viewBox="0 0 1200 410" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050A14"/>
      <stop offset="1" stop-color="#0D0817"/>
    </linearGradient>
    <linearGradient id="accent" x1="90" y1="0" x2="1110" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset=".5" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#94A3B8" stroke-opacity=".03"/>
    </pattern>
  </defs>

  <rect width="1200" height="410" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="410" rx="28" fill="url(#grid)"/>

  <text x="58" y="48" fill="#708198" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="700" letter-spacing="2.2">PUBLIC CODE SNAPSHOT</text>
  <text x="1140" y="48" text-anchor="end" fill="#5B506C" font-family="Georgia,serif" font-size="12.5" font-style="italic">public repositories only</text>

  <g transform="translate(245 218)">
    <circle r="108" fill="#09111D" stroke="#E2E8F0" stroke-opacity=".06"/>
    <circle r="82" fill="none" stroke="#182333" stroke-width="26"/>

    <!-- coffeehouse 63.3% -->
    <circle r="82" fill="none" stroke="#5EEAD4" stroke-width="26"
            stroke-dasharray="326.1 188.9" stroke-dashoffset="0"
            transform="rotate(-90)"/>
    <!-- Carousel 23.6% -->
    <circle r="82" fill="none" stroke="#7DD3FC" stroke-width="26"
            stroke-dasharray="121.5 393.5" stroke-dashoffset="-326.1"
            transform="rotate(-90)"/>
    <!-- profile repo 5.9% -->
    <circle r="82" fill="none" stroke="#C084FC" stroke-width="26"
            stroke-dasharray="30.4 484.6" stroke-dashoffset="-447.6"
            transform="rotate(-90)"/>
    <!-- CoreMotion 4.1% -->
    <circle r="82" fill="none" stroke="#F0ABFC" stroke-width="26"
            stroke-dasharray="21.1 493.9" stroke-dashoffset="-478"
            transform="rotate(-90)"/>
    <!-- RotatingLogo 2.3% -->
    <circle r="82" fill="none" stroke="#A7F3D0" stroke-width="26"
            stroke-dasharray="11.9 503.1" stroke-dashoffset="-499.1"
            transform="rotate(-90)"/>
    <!-- DonationApp 0.9% -->
    <circle r="82" fill="none" stroke="#CBD5E1" stroke-width="26"
            stroke-dasharray="4.5 510.5" stroke-dashoffset="-511"
            transform="rotate(-90)"/>

    <text x="0" y="-4" text-anchor="middle" fill="#F8FAFC" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="800">6</text>
    <text x="0" y="22" text-anchor="middle" fill="#8FA0B7" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">PUBLIC REPOS</text>
  </g>

  <text x="58" y="375" fill="#5E7088" font-family="Inter,Arial,sans-serif" font-size="11">Repository footprint by GitHub-reported repository size</text>

  <g font-family="Inter,Arial,sans-serif">
    <text x="455" y="98" fill="#F8FAFC" font-size="18" font-weight="750">Public repository footprint</text>
    <text x="455" y="122" fill="#8798AE" font-size="12.5">Relative size across public repositories</text>

    <g transform="translate(455 155)">
      <circle cx="5" cy="5" r="5" fill="#5EEAD4"/>
      <text x="22" y="9" fill="#CFE9E4" font-size="13" font-weight="650">coffeehouse</text>
      <text x="260" y="9" fill="#8798AE" font-size="12">63.3%</text>
      <rect x="330" y="-1" width="290" height="12" rx="6" fill="#101B29"/>
      <rect x="330" y="-1" width="184" height="12" rx="6" fill="#5EEAD4" fill-opacity=".82"/>
    </g>

    <g transform="translate(455 198)">
      <circle cx="5" cy="5" r="5" fill="#7DD3FC"/>
      <text x="22" y="9" fill="#D4ECF7" font-size="13" font-weight="650">Carousel</text>
      <text x="260" y="9" fill="#8798AE" font-size="12">23.6%</text>
      <rect x="330" y="-1" width="290" height="12" rx="6" fill="#101B29"/>
      <rect x="330" y="-1" width="68" height="12" rx="6" fill="#7DD3FC" fill-opacity=".82"/>
    </g>

    <g transform="translate(455 241)">
      <circle cx="5" cy="5" r="5" fill="#C084FC"/>
      <text x="22" y="9" fill="#E6D6FB" font-size="13" font-weight="650">NiloufarRabiee</text>
      <text x="260" y="9" fill="#8798AE" font-size="12">5.9%</text>
      <rect x="330" y="-1" width="290" height="12" rx="6" fill="#101B29"/>
      <rect x="330" y="-1" width="17" height="12" rx="6" fill="#C084FC" fill-opacity=".82"/>
    </g>

    <g transform="translate(455 284)">
      <circle cx="5" cy="5" r="5" fill="#F0ABFC"/>
      <text x="22" y="9" fill="#F4D8FA" font-size="13" font-weight="650">CoreMotion</text>
      <text x="260" y="9" fill="#8798AE" font-size="12">4.1%</text>
      <rect x="330" y="-1" width="290" height="12" rx="6" fill="#101B29"/>
      <rect x="330" y="-1" width="12" height="12" rx="6" fill="#F0ABFC" fill-opacity=".82"/>
    </g>

    <g transform="translate(455 327)">
      <circle cx="5" cy="5" r="5" fill="#A7F3D0"/>
      <text x="22" y="9" fill="#D9F7EC" font-size="13" font-weight="650">RotatingLogo + DonationApp</text>
      <text x="260" y="9" fill="#8798AE" font-size="12">3.2%</text>
      <rect x="330" y="-1" width="290" height="12" rx="6" fill="#101B29"/>
      <rect x="330" y="-1" width="9" height="12" rx="6" fill="#A7F3D0" fill-opacity=".82"/>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="408" rx="27" stroke="#E2E8F0" stroke-opacity=".06"/>
</svg>