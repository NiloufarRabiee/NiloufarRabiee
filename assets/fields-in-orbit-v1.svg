<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050811"/>
      <stop offset="0.52" stop-color="#08101A"/>
      <stop offset="1" stop-color="#0C0715"/>
    </linearGradient>
    <linearGradient id="orbit" x1="130" y1="0" x2="1080" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="0.46" stop-color="#7DD3FC"/>
      <stop offset="0.74" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#FF6EC7"/>
    </linearGradient>
    <radialGradient id="g1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(325 190) rotate(90) scale(130)">
      <stop stop-color="#5EEAD4" stop-opacity=".11"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(845 155) rotate(90) scale(150)">
      <stop stop-color="#C084FC" stop-opacity=".12"/>
      <stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#g1)"/>
  <rect width="1200" height="360" rx="28" fill="url(#g2)"/>

  <g opacity=".52">
    <circle cx="92" cy="74" r="1.1" fill="#F8FAFC"/>
    <circle cx="170" cy="118" r="1.5" fill="#7DD3FC"/>
    <circle cx="278" cy="55" r="1.1" fill="#C084FC"/>
    <circle cx="420" cy="92" r="1.2" fill="#5EEAD4"/>
    <circle cx="572" cy="70" r="1.0" fill="#F8FAFC"/>
    <circle cx="702" cy="112" r="1.2" fill="#FF6EC7"/>
    <circle cx="882" cy="66" r="1.2" fill="#7DD3FC"/>
    <circle cx="1092" cy="96" r="1.3" fill="#C084FC"/>
    <circle cx="105" cy="286" r="1.2" fill="#FF6EC7"/>
    <circle cx="311" cy="315" r="1.0" fill="#F8FAFC"/>
    <circle cx="634" cy="293" r="1.4" fill="#5EEAD4"/>
    <circle cx="1014" cy="299" r="1.2" fill="#7DD3FC"/>
  </g>

  <text x="58" y="48" fill="#6F8098" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="2.1">FIELDS IN ORBIT</text>
  <text x="1142" y="48" text-anchor="end" fill="#5D526F" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" font-style="italic">different mediums · same curiosity</text>

  <g fill="none" stroke-linecap="round">
    <path d="M170 222C298 112 438 111 566 176C682 236 836 247 1029 141" stroke="url(#orbit)" stroke-opacity=".22" stroke-width="1.4"/>
    <path d="M210 125C356 250 554 270 712 170C820 101 930 92 1075 173" stroke="url(#orbit)" stroke-opacity=".16" stroke-width="1.15"/>
    <path d="M238 278C419 202 534 106 697 120C839 132 929 226 1022 262" stroke="url(#orbit)" stroke-opacity=".11" stroke-width="1"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(186 214)">
      <circle r="5.5" fill="#5EEAD4" filter="url(#glow)"/>
      <text x="17" y="-3" fill="#B8F5E7" font-size="16" font-weight="700">Spatial Systems</text>
      <text x="17" y="19" fill="#7E8EA6" font-size="11.5">architecture · urban interfaces</text>
    </g>

    <g transform="translate(324 112)">
      <circle r="5.5" fill="#7DD3FC" filter="url(#glow)"/>
      <text x="17" y="-3" fill="#C6ECFC" font-size="16" font-weight="700">Human-centered AI</text>
      <text x="17" y="19" fill="#7E8EA6" font-size="11.5">behavior · interaction</text>
    </g>

    <g transform="translate(540 250)">
      <circle r="5.5" fill="#5EEAD4" filter="url(#glow)"/>
      <text x="17" y="-3" fill="#B8F5E7" font-size="16" font-weight="700">Experimental Work</text>
      <text x="17" y="19" fill="#7E8EA6" font-size="11.5">small products · prototypes</text>
    </g>

    <g transform="translate(700 118)">
      <circle r="5.5" fill="#C084FC" filter="url(#glow)"/>
      <text x="17" y="-3" fill="#E7D8FE" font-size="16" font-weight="700">Interaction Design</text>
      <text x="17" y="19" fill="#7E8EA6" font-size="11.5">interfaces · experience</text>
    </g>

    <g transform="translate(880 236)">
      <circle r="5.5" fill="#FF6EC7" filter="url(#glow)"/>
      <text x="17" y="-3" fill="#FFD2EB" font-size="16" font-weight="700">Independent Research</text>
      <text x="17" y="19" fill="#7E8EA6" font-size="11.5">questions · papers · concepts</text>
    </g>

    <g transform="translate(1006 138)">
      <circle r="5.5" fill="#7DD3FC" filter="url(#glow)"/>
      <text x="-17" y="-3" text-anchor="end" fill="#C6ECFC" font-size="16" font-weight="700">Apple Prototypes</text>
      <text x="-17" y="19" text-anchor="end" fill="#7E8EA6" font-size="11.5">SwiftUI · experiments</text>
    </g>
  </g>

  <g>
    <circle r="3.5" fill="#FFFFFF" filter="url(#glow)">
      <animateMotion dur="8s" repeatCount="indefinite" path="M170 222C298 112 438 111 566 176C682 236 836 247 1029 141"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.8" fill="#FF9CDC" filter="url(#glow)">
      <animateMotion dur="10s" begin="2.5s" repeatCount="indefinite" path="M210 125C356 250 554 270 712 170C820 101 930 92 1075 173"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="10s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="60" y="326" fill="#5D526F" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" font-style="italic">a public surface of a larger practice</text>
  <rect x="1" y="1" width="1198" height="358" rx="27" stroke="#E2E8F0" stroke-opacity=".06"/>
</svg>