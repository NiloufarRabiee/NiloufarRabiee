<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#03040A"/>
      <stop offset="0.58" stop-color="#080611"/>
      <stop offset="1" stop-color="#12051A"/>
    </linearGradient>

    <linearGradient id="edge" x1="730" y1="0" x2="1080" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78FFB0"/>
      <stop offset="0.52" stop-color="#B64CFF"/>
      <stop offset="1" stop-color="#FF5EC8"/>
    </linearGradient>

    <radialGradient id="violet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(958 132) rotate(90) scale(122 170)">
      <stop stop-color="#B64CFF" stop-opacity=".14"/>
      <stop offset="1" stop-color="#B64CFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="25" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="25" fill="url(#violet)"/>

  <g opacity=".48">
    <circle cx="86" cy="57" r="1.1" fill="#FFFFFF"/>
    <circle cx="144" cy="192" r="1.3" fill="#78FFB0"/>
    <circle cx="312" cy="74" r="1.2" fill="#B64CFF"/>
    <circle cx="472" cy="201" r="1.0" fill="#FF5EC8"/>
    <circle cx="645" cy="65" r="1.2" fill="#FFFFFF"/>
    <circle cx="1092" cy="63" r="1.2" fill="#78FFB0"/>
    <circle cx="1123" cy="204" r="1.1" fill="#FF5EC8"/>
  </g>

  <text x="96" y="86"
        fill="#F8F5FF"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="38"
        font-weight="700">
    Not all paths announce themselves.
  </text>

  <text x="98" y="128"
        fill="#8F86A3"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="16"
        font-style="italic"
        letter-spacing="1.3">
    follow what keeps pulling at your attention
  </text>

  <path d="M98 164C250 153 377 168 520 198"
        stroke="url(#edge)"
        stroke-opacity=".42"
        stroke-width="1.3"
        stroke-linecap="round"/>

  <circle cx="98" cy="164" r="3.2" fill="#78FFB0" filter="url(#glow)"/>

  <text x="98" y="214"
        fill="#655A77"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="9.5"
        font-weight="700"
        letter-spacing="2.1">
    NILOUFAR RABIEE  /  00:∞
  </text>

  <g transform="translate(958 130)">
    <ellipse rx="130" ry="105"
             stroke="#B64CFF"
             stroke-opacity=".09"
             stroke-dasharray="3 11">
      <animateTransform attributeName="transform"
                        type="rotate"
                        from="0"
                        to="360"
                        dur="22s"
                        repeatCount="indefinite"/>
    </ellipse>

    <path d="M-40 -68L18 -58L18 61L-40 70Z"
          fill="#07050D"
          stroke="url(#edge)"
          stroke-opacity=".62"
          stroke-width="1.2"/>

    <path d="M18 -58L45 -42V47L18 61Z"
          fill="#0C0712"
          stroke="#FF5EC8"
          stroke-opacity=".22"/>

    <path d="M-40 -68L-13 -52L45 -42L18 -58Z"
          fill="#0B0710"
          stroke="#78FFB0"
          stroke-opacity=".16"/>

    <path d="M-9 -12V12M-21 0H3"
          stroke="#FF67CA"
          stroke-width="1.3"
          filter="url(#glow)"/>

    <circle cx="-9" cy="0" r="2.8" fill="#FFFFFF" filter="url(#glow)"/>

    <g transform="translate(-105 57)" filter="url(#glow)">
      <ellipse cx="0" cy="0" rx="18" ry="10.5" fill="#FFFFFF"/>
      <circle cx="19" cy="-8" r="8.5" fill="#FFFFFF"/>
      <ellipse cx="17" cy="-23" rx="3" ry="11" fill="#FFFFFF" transform="rotate(-12 17 -23)"/>
      <ellipse cx="24" cy="-22" rx="3" ry="11" fill="#FFF5FC" transform="rotate(9 24 -22)"/>
      <circle cx="-18" cy="-2" r="5.5" fill="#FFFFFF"/>
      <circle cx="22" cy="-9" r="1.4" fill="#17111D"/>
      <animateTransform attributeName="transform"
                        additive="sum"
                        type="translate"
                        values="-8 0; 8 -3; -8 0"
                        dur="3.6s"
                        repeatCount="indefinite"/>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="258" rx="24" stroke="#D8C5FF" stroke-opacity=".07"/>
</svg>