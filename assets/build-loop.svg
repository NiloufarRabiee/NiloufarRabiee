<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070A12"/>
      <stop offset="1" stop-color="#0A1120"/>
    </linearGradient>
    <linearGradient id="signal" x1="120" y1="0" x2="1080" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1200" height="330" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="328" rx="25" stroke="#E2E8F0" stroke-opacity="0.08"/>

  <text x="78" y="72" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">RESEARCH → PROTOTYPE LOOP</text>
  <text x="78" y="102" fill="#7E8FA7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" letter-spacing="1.4">A SYSTEM FOR TURNING QUESTIONS INTO TESTABLE INTERACTIONS</text>

  <path d="M112 194H1087" stroke="#617189" stroke-opacity="0.28" stroke-width="2"/>
  <path d="M112 194H1087" stroke="url(#signal)" stroke-width="2" stroke-dasharray="5 12" opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="0" to="-68" dur="4s" repeatCount="indefinite"/>
  </path>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(112 194)">
      <circle r="28" fill="#09131C" stroke="#5EEAD4" stroke-opacity="0.65"/>
      <text x="0" y="5" text-anchor="middle" fill="#DDFBF6" font-size="15" font-weight="800">01</text>
      <text x="0" y="62" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700">OBSERVE</text>
      <text x="0" y="82" text-anchor="middle" fill="#8495AC" font-size="11">people · place · context</text>
    </g>
    <g transform="translate(307 194)">
      <circle r="28" fill="#09131C" stroke="#69DDD9" stroke-opacity="0.65"/>
      <text x="0" y="5" text-anchor="middle" fill="#DDFBF6" font-size="15" font-weight="800">02</text>
      <text x="0" y="62" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700">FRAME</text>
      <text x="0" y="82" text-anchor="middle" fill="#8495AC" font-size="11">question · constraint</text>
    </g>
    <g transform="translate(502 194)">
      <circle r="28" fill="#09131C" stroke="#7DD3FC" stroke-opacity="0.72"/>
      <text x="0" y="5" text-anchor="middle" fill="#E3F5FD" font-size="15" font-weight="800">03</text>
      <text x="0" y="62" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700">DESIGN</text>
      <text x="0" y="82" text-anchor="middle" fill="#8495AC" font-size="11">system · interface · rule</text>
    </g>
    <g transform="translate(697 194)">
      <circle r="28" fill="#09131C" stroke="#91C9FC" stroke-opacity="0.72"/>
      <text x="0" y="5" text-anchor="middle" fill="#E8F3FF" font-size="15" font-weight="800">04</text>
      <text x="0" y="62" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700">BUILD</text>
      <text x="0" y="82" text-anchor="middle" fill="#8495AC" font-size="11">prototype · instrument</text>
    </g>
    <g transform="translate(892 194)">
      <circle r="28" fill="#09131C" stroke="#A7BDFC" stroke-opacity="0.72"/>
      <text x="0" y="5" text-anchor="middle" fill="#F0EDFF" font-size="15" font-weight="800">05</text>
      <text x="0" y="62" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700">TEST</text>
      <text x="0" y="82" text-anchor="middle" fill="#8495AC" font-size="11">behavior · clarity · risk</text>
    </g>
    <g transform="translate(1087 194)">
      <circle r="28" fill="#09131C" stroke="#C4B5FD" stroke-opacity="0.72"/>
      <text x="0" y="5" text-anchor="middle" fill="#F3EFFF" font-size="15" font-weight="800">06</text>
      <text x="0" y="62" text-anchor="middle" fill="#F8FAFC" font-size="14" font-weight="700">REFINE</text>
      <text x="0" y="82" text-anchor="middle" fill="#8495AC" font-size="11">evidence → next loop</text>
    </g>
  </g>

  <circle r="5.5" fill="#F8FAFC" filter="url(#soft)">
    <animateMotion dur="5.5s" repeatCount="indefinite" path="M112 194H1087"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="5.5s" repeatCount="indefinite"/>
  </circle>
