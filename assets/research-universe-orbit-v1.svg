      <stop offset="0.50" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="orbitStroke" x1="690" y1="165" x2="1145" y2="430" gradientUnits="userSpaceOnUse">
