      <stop offset="0.52" stop-color="#7DD3FC" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#C084FC" stop-opacity="0.34"/>
    </linearGradient>

    <radialGradient id="planet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(910 255) rotate(58) scale(83 78)">
