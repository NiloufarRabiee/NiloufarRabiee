      <stop stop-color="#08120F"/>
      <stop offset="1" stop-color="#10151D"/>
    </linearGradient>
    <linearGradient id="accent" x1="430" y1="76" x2="548" y2="214" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
