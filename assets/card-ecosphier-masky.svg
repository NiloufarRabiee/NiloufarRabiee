  <text x="50" y="48" fill="#F6BE55" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="800" letter-spacing="1.8">04 / CASE STUDY · PRODUCT</text>
  <text x="50" y="101" fill="#F8FAFC" font-family="Inter,system-ui,sans-serif" font-size="34" font-weight="750">Ecosphier + Masky</text>
  <text x="50" y="129" fill="#8EEBD9" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="1">SUSTAINABILITY · EMOTION LITERACY</text>

  <text x="50" y="171" fill="#C5D2D4" font-family="Inter,system-ui,sans-serif" font-size="15">Interactive product explorations spanning carbon</text>
  <text x="50" y="194" fill="#C5D2D4" font-family="Inter,system-ui,sans-serif" font-size="15">awareness, 3D communication, and playful learning.</text>

  <g transform="translate(50 242)">
    <rect width="142" height="34" rx="17" fill="#111B18" stroke="#5EEAD4" stroke-opacity=".28"/>
