  <g stroke="#B8C9D0" stroke-opacity=".035">
    <path d="M0 64H620M0 128H620M0 192H620M0 256H620"/>
    <path d="M62 0V320M124 0V320M186 0V320M248 0V320M310 0V320M372 0V320M434 0V320M496 0V320M558 0V320"/>
