      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(500 150) rotate(180) scale(150 120)">
      <stop stop-color="#5EEAD4" stop-opacity=".10"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
